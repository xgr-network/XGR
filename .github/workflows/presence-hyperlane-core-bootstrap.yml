name: Presence Hyperlane Core Bootstrap
on:
  push:
    branches: [presence/hyperlane-core-bootstrap-20260919]
    paths: [.github/workflows/presence-hyperlane-core-bootstrap.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit deployed XGR Hyperlane Mailbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h && cd /tmp/h
          npm init -y >/dev/null
          npm install --silent @hyperlane-xyz/core@12.1.0 ethers@5
          cat > audit.mjs <<'NODE'
          import { ethers } from 'ethers';
          import { Mailbox__factory } from '@hyperlane-xyz/core';
          const p=new ethers.providers.JsonRpcProvider('https://rpc.xgr.network');
          const mailbox='0x5632409bc2f0e8bAc4AaF43654D4FFc7822C9c79';
          const m=Mailbox__factory.connect(mailbox,p);
          const implSlot='0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc';
          const adminSlot='0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103';
          const addr=(x)=>ethers.utils.getAddress('0x'+x.slice(-40));
          console.log('CHAIN_ID='+(await p.getNetwork()).chainId);
          console.log('LOCAL_DOMAIN='+(await m.localDomain()).toString());
          console.log('OWNER='+await m.owner());
          console.log('DEFAULT_ISM='+await m.defaultIsm());
          console.log('DEFAULT_HOOK='+await m.defaultHook());
          console.log('REQUIRED_HOOK='+await m.requiredHook());
          console.log('IMPLEMENTATION='+addr(await p.getStorageAt(mailbox,implSlot)));
          console.log('ADMIN='+addr(await p.getStorageAt(mailbox,adminSlot)));
          console.log('CODE_BYTES='+((await p.getCode(mailbox)).length-2)/2);
          NODE
          node audit.mjs
