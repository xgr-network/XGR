name: Presence Hyperlane Core Bootstrap
on:
  push:
    branches: [presence/hyperlane-core-bootstrap-20260919]
    paths: [.github/workflows/presence-hyperlane-core-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Hyperlane Mailbox implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h && cd /tmp/h
          npm init -y >/dev/null
          npm install --silent @hyperlane-xyz/core@12.1.0 ethers@5
          cat > p.mjs <<'NODE'
          import { ethers } from 'ethers';
          import { Mailbox__factory } from '@hyperlane-xyz/core';
          const provider=new ethers.providers.JsonRpcProvider('https://rpc.xgr.network');
          const from='0xE3dA0303c8d48Dd8d4d6f9ba438cD5816b36BBD1';
          const n=await provider.getTransactionCount(from,'pending');
          const f=new Mailbox__factory();
          const tx=f.getDeployTransaction(1643);
          const gas=await provider.estimateGas({from,data:tx.data});
          console.log('CHAIN_ID='+(await provider.getNetwork()).chainId);
          console.log('NONCE='+n);
          console.log('ADDRESS='+ethers.utils.getContractAddress({from,nonce:n}));
          console.log('GAS='+gas.toString());
          console.log('KECCAK='+ethers.utils.keccak256(tx.data));
          console.log('INIT_DATA='+f.interface.encodeFunctionData('initialize',[from,'0xa49AB7f367B6EA25ae1362883F505E2Dc612d1e3','0xa49AB7f367B6EA25ae1362883F505E2Dc612d1e3','0xa49AB7f367B6EA25ae1362883F505E2Dc612d1e3']));
          console.log('CREATION_DATA_BEGIN');
          console.log(tx.data);
          console.log('CREATION_DATA_END');
          NODE
          node p.mjs
