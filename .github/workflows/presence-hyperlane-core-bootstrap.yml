name: Presence Hyperlane Mailbox Activation
on:
  push:
    branches: [presence/hyperlane-core-bootstrap-20260919]
    paths: [.github/workflows/presence-hyperlane-core-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Estimate Mailbox security setter transactions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h && cd /tmp/h
          npm init -y >/dev/null
          npm install --silent @hyperlane-xyz/core@12.1.0 ethers@5
          cat > p.mjs <<'NODE'
          import { ethers } from 'ethers';
          import { Mailbox__factory } from '@hyperlane-xyz/core';
          const p=new ethers.providers.JsonRpcProvider('https://rpc.xgr.network');
          const from='0xE3dA0303c8d48Dd8d4d6f9ba438cD5816b36BBD1';
          const mailbox='0x5632409bc2f0e8bAc4AaF43654D4FFc7822C9c79';
          const routing='0xAf03B407FED3c4857A24Be9ac8EC64b7d178AA51';
          const merkle='0xeD98Af715b5a72dCD412567eb086d48225CDDACF';
          const protocol='0xf5f7A6D1Bd721D56F016b77e4Fc59C24bE5EA75f';
          const m=new Mailbox__factory();
          const txs=[
            ['SET_ISM',m.interface.encodeFunctionData('setDefaultIsm',[routing])],
            ['SET_DEFAULT_HOOK',m.interface.encodeFunctionData('setDefaultHook',[merkle])],
            ['SET_REQUIRED_HOOK',m.interface.encodeFunctionData('setRequiredHook',[protocol])]
          ];
          console.log('CHAIN_ID='+(await p.getNetwork()).chainId);
          console.log('NONCE='+(await p.getTransactionCount(from,'pending')));
          for(const [name,data] of txs){
            const gas=await p.estimateGas({from,to:mailbox,data});
            console.log(name+'_GAS='+gas.toString());
            console.log(name+'_DATA='+data);
          }
          NODE
          node p.mjs
