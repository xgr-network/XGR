name: Presence Hyperlane Security Bootstrap
on:
  push:
    branches: [presence/hyperlane-core-bootstrap-20260919]
    paths: [.github/workflows/presence-hyperlane-core-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Base-only DomainRoutingIsm on XGRChain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h && cd /tmp/h
          npm init -y >/dev/null
          npm install --silent @hyperlane-xyz/core@12.1.0 ethers@5
          cat > p.mjs <<'NODE'
          import { ethers } from 'ethers';
          import { DomainRoutingIsmFactory__factory } from '@hyperlane-xyz/core';
          const provider=new ethers.providers.JsonRpcProvider('https://rpc.xgr.network');
          const from='0xE3dA0303c8d48Dd8d4d6f9ba438cD5816b36BBD1';
          const factoryAddress='0xfbcE47b2A2Eb371700C6b82bf001d82996C64035';
          const baseIsm='0x15Aad8569fe7e6E3E6eC6c6dE3f696bB1eEF7148';
          const domains=[8453];
          const modules=[baseIsm];
          const factory=DomainRoutingIsmFactory__factory.connect(factoryAddress,provider);
          const tx=await factory.populateTransaction.deploy(from,domains,modules);
          const gas=await provider.estimateGas({from,to:factoryAddress,data:tx.data});
          const nonce=await provider.getTransactionCount(from,'pending');
          console.log('CHAIN_ID='+(await provider.getNetwork()).chainId);
          console.log('NONCE='+nonce);
          console.log('ESTIMATED_GAS='+gas.toString());
          console.log('CALLDATA='+tx.data);
          NODE
          node p.mjs
