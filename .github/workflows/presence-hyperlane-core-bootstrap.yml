name: Presence Hyperlane ValidatorAnnounce
on:
  push:
    branches: [presence/hyperlane-core-bootstrap-20260919]
    paths: [.github/workflows/presence-hyperlane-core-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare ValidatorAnnounce
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h && cd /tmp/h
          npm init -y >/dev/null
          npm install --silent @hyperlane-xyz/core@12.1.0 ethers@5
          cat > p.mjs <<'NODE'
          import { ethers } from 'ethers';
          import { ValidatorAnnounce__factory } from '@hyperlane-xyz/core';
          const p=new ethers.providers.JsonRpcProvider('https://rpc.xgr.network');
          const from='0xE3dA0303c8d48Dd8d4d6f9ba438cD5816b36BBD1';
          const mailbox='0x5632409bc2f0e8bAc4AaF43654D4FFc7822C9c79';
          const nonce=await p.getTransactionCount(from,'pending');
          const f=new ValidatorAnnounce__factory();
          const tx=f.getDeployTransaction(mailbox);
          const gas=await p.estimateGas({from,data:tx.data});
          console.log('CHAIN_ID='+(await p.getNetwork()).chainId);
          console.log('NONCE='+nonce);
          console.log('ADDRESS='+ethers.utils.getContractAddress({from,nonce}));
          console.log('GAS='+gas.toString());
          console.log('DATA='+tx.data);
          NODE
          node p.mjs
